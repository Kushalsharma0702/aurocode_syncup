# SyncUp — nginx site config.
#
# Rate-limit zones are defined at http{} scope. deploy.sh installs this file
# into conf.d/ so the zones load before the server blocks below.
#
# TLS: set SYNCUP_DOMAIN and run certbot, then uncomment the HTTPS server and
# the HTTP->HTTPS redirect at the bottom. Until a real domain exists this
# serves plain HTTP on :3210 for local use.

limit_req_zone $binary_remote_addr zone=syncup_widget:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=syncup_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=syncup_api:10m rate=120r/m;

# Only compress text; compressing already-compressed images wastes CPU.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml+rss application/atom+xml image/svg+xml
    application/vnd.ms-fontobject application/x-font-ttf font/opentype;

server {
    listen 3210;
    server_name _;

    root /opt/apps/syncup/frontend/dist;
    index index.html;

    # Screenshots are capped at 5 MB server-side; general attachments at 20 MB.
    # This is the outer ceiling for everything.
    client_max_body_size 21m;
    client_body_timeout 30s;

    server_tokens off;

    # --- security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Uncomment once HTTPS is actually in place — sending HSTS over plain HTTP
    # does nothing, and sending it from a host you later can't serve over TLS
    # locks browsers out.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The embeddable widget must be loadable from any client site.
    location = /widget.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /vendor/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Public widget writes: the main abuse surface. Tight bucket, generous burst
    # so a client filing three things quickly isn't punished.
    location /api/public/widget/ {
        limit_req zone=syncup_widget burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Credential endpoints: brute-force protection in front of the app's own.
    location ~ ^/api/auth/(login|magic) {
        limit_req zone=syncup_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=syncup_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        access_log off;
    }

    # Hashed build assets are safe to cache hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback — serve index.html for all unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
