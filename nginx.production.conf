# SyncUp — production nginx config for syncup.aurocode.in
#
# The TLS lines are managed by certbot. Keep the ssl_certificate paths and
# server_name exactly as they are, or renewal breaks.
#
# Rate limits are deliberately generous. This serves a live client, and a
# false 429 on their project portal is worse than the abuse it would prevent.
# The tight limits are on the two endpoints that actually get attacked:
# unauthenticated widget writes, and login.
#
# Install:  sudo cp nginx.production.conf /etc/nginx/sites-available/syncup
#           sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=syncup_api:10m    rate=300r/m;
limit_req_zone $binary_remote_addr zone=syncup_login:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=syncup_widget:10m rate=20r/m;

# `gzip on` is deliberately absent: Ubuntu's /etc/nginx/nginx.conf already sets
# it at http level, and nginx rejects a duplicate in the same context. It does
# not set gzip_types, though, so without the list below only text/html is
# compressed — which leaves the JS bundle and API responses uncompressed.
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml+rss application/atom+xml image/svg+xml
    application/vnd.ms-fontobject application/x-font-ttf font/opentype;

server {
    server_name syncup.aurocode.in;

    root /opt/apps/syncup/frontend/dist;
    index index.html;

    client_max_body_size 21m;
    client_body_timeout 30s;
    server_tokens off;

    # --- security headers ---
    # The app sets these too, so that it stays safe if ever exposed directly.
    # Strip its copies here so each header is sent exactly once and nginx is
    # the single authority — otherwise X-Frame-Options arrives twice with
    # conflicting values (DENY from the app, SAMEORIGIN here).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Liveness + database reachability, for an external uptime monitor.
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # The embeddable widget is loaded by <script> from client sites, so it must
    # be reachable cross-origin. A short cache keeps rollouts quick.
    location = /widget.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # html2canvas, served from here rather than a CDN so embedding SyncUp
    # doesn't give a third party script execution on the client's site.
    location /vendor/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Unauthenticated widget writes — the main abuse surface. The widget key
    # is public by design, so this is the first line of defence; the app
    # enforces per-key and per-IP limits behind it.
    location /api/public/widget/ {
        limit_req zone=syncup_widget burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Credential endpoints.
    location ~ ^/api/auth/(login|magic) {
        limit_req zone=syncup_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=syncup_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep booting an old bundle
    # against a migrated API.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/syncup.aurocode.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/syncup.aurocode.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = syncup.aurocode.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name syncup.aurocode.in;
    return 404; # managed by Certbot
}
